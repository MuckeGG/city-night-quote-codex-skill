name: validate-skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
      - name: Run compatibility tests
        run: python -m unittest discover -s tests -v
      - name: Validate skill metadata
        run: >-
          python -c "from pathlib import Path; t=Path('SKILL.md').read_text(encoding='utf-8');
          assert t.startswith('---\\n') and '\\nname: city-night-quote-codex-skill\\n' in t and '\\ndescription: ' in t"
